[project]
name = "horizontal"
version = "0.2.0"
description = "Python bindings and an MCP server for Horizontal, the macOS PCB design tool."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.1,<3",
    "pydantic>=2.12,<3",
    "matplotlib>=3.10,<4",
]

[project.scripts]
horizontal-mcp = "horizontal.mcp_server:main"
horizontal-ato = "horizontal.ato:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["horizontal"]
